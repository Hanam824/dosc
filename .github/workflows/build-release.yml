name: Build release files

# Tests one commit and builds the unsigned IPA and the simulator app (artifact `dosc-ios`).
# Called by release.yml and nightly-release.yml, which then publish the files.
on:
  workflow_call:
    inputs:
      version:
        description: "Version written into the build and the file names, e.g. v0.2.0"
        required: true
        type: string
      sha:
        description: "Commit to build"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build iOS
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0 # the build number is the commit count

      - name: Package cache
        uses: actions/cache@v4
        with:
          path: Packages/DoscKit/.build
          key: spm-${{ runner.os }}-${{ hashFiles('Packages/DoscKit/Package.swift', 'Packages/DoscKit/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Test
        run: swift test --package-path Packages/DoscKit

      # GITHUB_CLIENT_ID is an optional repository variable (Settings → Variables): the OAuth App
      # used for "Sign in with GitHub". Without it, release builds offer token sign-in only.
      - name: Build the release files
        id: package
        env:
          VERSION: ${{ inputs.version }}
          GITHUB_CLIENT_ID: ${{ vars.GITHUB_CLIENT_ID }}
        run: |
          if [ -n "$GITHUB_CLIENT_ID" ]; then
            echo "GITHUB_CLIENT_ID = $GITHUB_CLIENT_ID" > Config/Secrets.xcconfig
          fi
          ./scripts/package-release.sh "$VERSION"
          ls -l dist

      - name: Upload the files
        uses: actions/upload-artifact@v4
        with:
          name: dosc-ios
          path: dist/*
          if-no-files-found: error
